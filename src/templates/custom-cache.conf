# ------------------------------------------------------------
# WP Rocket disk cache headers
# ------------------------------------------------------------
location ~* /cache/wp-rocket/.+\.(html|html_gzip)$ {
    add_header Cache-Control "public, max-age=60, s-maxage=300, stale-while-revalidate=1800" always;
    add_header X-Cache-Edge "300s" always;
    add_header X-Cache-Browser "60s" always;
    add_header X-Cache-Swr "1800s" always;
    add_header X-Cache-Type "wp-rocket-disk" always;
}

# ------------------------------------------------------------
# Live score feeds
# ------------------------------------------------------------
location ^~ /app/uploads/livescores/ {
    add_header Cache-Control "public, max-age=5, stale-while-revalidate=10" always;
    add_header X-Live-Data "1" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# ------------------------------------------------------------
# Match content JSON
# ------------------------------------------------------------
location ^~ /app/uploads/match-content/ {
    location ~ \.json$ {
        add_header Cache-Control "public, max-age=15, stale-while-revalidate=30" always;
        add_header X-Match-Content "1" always;
        try_files $uri =404;
    }
}

# ------------------------------------------------------------
# Match modals
# ------------------------------------------------------------
location ^~ /app/uploads/match-modals/ {
    add_header Cache-Control "public, max-age=60, stale-while-revalidate=120" always;
    add_header X-Match-Modal "1" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# ------------------------------------------------------------
# Match streamer JSON feeds
# ------------------------------------------------------------
location ~ ^/app/uploads/(bb-)?match-streamers/.+\.json$ {
    add_header Cache-Control "public, max-age=15, stale-while-revalidate=30" always;
    add_header X-Streamer-Feed "1" always;
    try_files $uri =404;
}

# ------------------------------------------------------------
# Theme images
# ------------------------------------------------------------
location ^~ /app/themes/ba-theme/resources/images/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Theme-Asset "1" always;
    try_files $uri =404;
}

# ------------------------------------------------------------
# Protect Blade source files
# ------------------------------------------------------------
location ~* \.(blade\.php)$ {
    deny all;
}

# ------------------------------------------------------------
# Trust HAProxy real IP
# ------------------------------------------------------------
set_real_ip_from 45.135.237.4;
set_real_ip_from 45.135.237.5;
real_ip_header X-Forwarded-For;
real_ip_recursive on;